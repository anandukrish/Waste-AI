name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-and-packaging:
    name: Companion, browser policies, and packaging
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Test companion
        run: python -m unittest discover -s companion -t . -v
      - name: Compile companion Python sources
        run: python -m compileall -q companion
      - name: Test browser chat policy
        run: cscript //nologo client/web-preview/chat_policy_test.js
      - name: Test browser voice policy
        run: cscript //nologo client/web-preview/voice_policy_test.js
      - name: Test browser security policy
        run: cscript //nologo client/web-preview/security_policy_test.js
      - name: Check packaging scripts and failure propagation
        run: ./packaging/test-packaging.ps1

  flutter:
    name: Flutter analysis and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Test Flutter client
        run: flutter test
